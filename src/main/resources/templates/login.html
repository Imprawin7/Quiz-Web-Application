<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuizPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill" style="font-size:2.5rem;color:#4f46e5;"></i>
            <h3 class="mt-2 mb-0 fw-bold">QuizPlatform</h3>
            <p class="text-muted">Sign in to continue</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label mb-0">Password</label>
                    <a href="/forgot-password" class="small">Forgot password?</a>
                </div>
                <div class="input-group">
                    <input type="password" name="password" id="password" class="form-control" required>
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
        </form>

        <p class="text-center mt-4 mb-0 text-muted">
            New student? <a href="/register">Create an account</a>
        </p>
        <p class="text-center mt-2 mb-0 small text-muted">
            Default admin login: <code>admin</code> / <code>Admin@123</code>
        </p>
    </div>
</div>

<script>
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const input = document.getElementById(btn.dataset.target);
            const icon = btn.querySelector('i');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('bi-eye', !isHidden);
            icon.classList.toggle('bi-eye-slash', isHidden);
        });
    });
</script>
</body>
</html>
