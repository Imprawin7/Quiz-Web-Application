<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>QuizPlatform Fragments</title>
</head>

<body>


<!-- =========================================================
     ADMIN NAVBAR
     ========================================================= -->

<nav th:fragment="navbar-admin"
     class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/admin/dashboard">

            <i class="bi bi-patch-question-fill me-2"></i>
            QuizPlatform

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#adminNavbar"
                aria-controls="adminNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="adminNavbar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="/admin/dashboard">

                        <i class="bi bi-speedometer2 me-1"></i>
                        Dashboard

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/admin/quizzes">

                        <i class="bi bi-journal-text me-1"></i>
                        Quizzes

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/admin/questions">

                        <i class="bi bi-question-circle me-1"></i>
                        Questions

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/admin/users">

                        <i class="bi bi-people me-1"></i>
                        Users

                    </a>
                </li>

                <li class="nav-item">

                    <form th:action="@{/logout}"
                          method="post"
                          class="d-inline">

                        <button type="submit"
                                class="btn btn-link nav-link">

                            <i class="bi bi-box-arrow-right me-1"></i>
                            Logout

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =========================================================
     STUDENT DESKTOP NAVBAR
     
     This is the normal navigation on desktop.
     It is NOT a sidebar.
     ========================================================= -->

<nav th:fragment="navbar-student"
     class="navbar navbar-expand-lg navbar-dark bg-primary student-navbar">

    <div class="container">

        <!-- BRAND -->

        <a class="navbar-brand fw-bold"
           href="/student/dashboard">

            <i class="bi bi-patch-question-fill me-2"></i>
            QuizPlatform

        </a>


        <!-- MOBILE HAMBURGER -->

        <button type="button"
                class="navbar-toggler student-mobile-toggle"
                id="studentMenuButton"
                aria-label="Open student menu"
                aria-controls="studentSidebar"
                aria-expanded="false">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- DESKTOP NAVIGATION -->

        <div class="collapse navbar-collapse"
             id="studentNavbar">

            <ul class="navbar-nav ms-auto">

                <!-- Dashboard -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="/student/dashboard">

                        <i class="bi bi-speedometer2 me-1"></i>
                        Dashboard

                    </a>

                </li>


                <!-- Quizzes -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="/student/quizzes">

                        <i class="bi bi-journal-text me-1"></i>
                        Quizzes

                    </a>

                </li>


                <!-- History -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="/student/history">

                        <i class="bi bi-clock-history me-1"></i>
                        My History

                    </a>

                </li>


                <!-- Leaderboard -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="/leaderboard">

                        <i class="bi bi-trophy me-1"></i>
                        Leaderboard

                    </a>

                </li>


                <!-- Profile -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="/student/profile">

                        <i class="bi bi-person-circle me-1"></i>
                        Profile

                    </a>

                </li>


                <!-- Logout -->

                <li class="nav-item">

                    <form th:action="@{/logout}"
                          method="post"
                          class="d-inline">

                        <button type="submit"
                                class="btn btn-link nav-link">

                            <i class="bi bi-box-arrow-right me-1"></i>
                            Logout

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =========================================================
     STUDENT MOBILE SIDEBAR
     
     IMPORTANT:
     Hidden by default.
     Opens only when the hamburger is clicked.
     ========================================================= -->

<div th:fragment="sidebar-student"
     class="student-sidebar"
     id="studentSidebar">

    <!-- SIDEBAR HEADER -->

    <div class="student-sidebar-header">

        <a href="/student/dashboard"
           class="student-sidebar-brand">

            <i class="bi bi-patch-question-fill me-2"></i>
            QuizPlatform

        </a>


        <!-- CLOSE -->

        <button type="button"
                class="student-sidebar-close"
                id="studentSidebarClose"
                aria-label="Close menu">

            <i class="bi bi-x-lg"></i>

        </button>

    </div>


    <!-- SIDEBAR LINKS -->

    <nav class="student-sidebar-nav">

        <a href="/student/dashboard"
           class="student-sidebar-link">

            <i class="bi bi-house-door-fill"></i>

            <span>Dashboard</span>

        </a>


        <a href="/student/quizzes"
           class="student-sidebar-link">

            <i class="bi bi-journal-text"></i>

            <span>Quizzes</span>

        </a>


        <a href="/student/history"
           class="student-sidebar-link">

            <i class="bi bi-clock-history"></i>

            <span>My History</span>

        </a>


        <a href="/leaderboard"
           class="student-sidebar-link">

            <i class="bi bi-trophy"></i>

            <span>Leaderboard</span>

        </a>


        <a href="/student/profile"
           class="student-sidebar-link">

            <i class="bi bi-person-circle"></i>

            <span>Profile</span>

        </a>

    </nav>


    <!-- LOGOUT -->

    <div class="student-sidebar-footer">

        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="student-sidebar-link student-logout">

                <i class="bi bi-box-arrow-right"></i>

                <span>Logout</span>

            </button>

        </form>

    </div>

</div>


<!-- =========================================================
     SIDEBAR OVERLAY
     ========================================================= -->

<div th:fragment="student-sidebar-overlay"
     class="student-sidebar-overlay"
     id="studentSidebarOverlay">
</div>


</body>
</html>
