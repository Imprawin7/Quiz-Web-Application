<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:fragment="head(title)" th:text="${title} + ' - QuizPlatform'">QuizPlatform</title>
</head>
<body>

<!-- Common <head> content, included via th:replace with a parameter for the title -->
<th:block th:fragment="headcontent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</th:block>

<nav th:fragment="navbar-admin" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard"><i class="bi bi-mortarboard-fill me-1"></i>QuizPlatform <span class="badge bg-primary badge-role">ADMIN</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navAdmin">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navAdmin">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/quizzes">Quizzes</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/categories">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/users">Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/attempts">All Attempts</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/analytics">Analytics</a></li>
                <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
            </form>
        </div>
    </div>
</nav>

<nav th:fragment="navbar-student" class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4" style="background-color:#4338ca;">
    <div class="container">
        <a class="navbar-brand" href="/student/dashboard"><i class="bi bi-mortarboard-fill me-1"></i>QuizPlatform <span class="badge bg-light text-dark badge-role">STUDENT</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navStudent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navStudent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/student/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/student/quizzes">Available Quizzes</a></li>
                <li class="nav-item"><a class="nav-link" href="/student/history">My History</a></li>
                <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
