<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>QuizPlatform Fragments</title>
</head>

<body>


<!-- =========================================================
     STUDENT SIDEBAR
     ========================================================= -->

<div th:fragment="sidebar-student"
     class="student-sidebar">

    <!-- BRAND -->

    <div class="sidebar-brand">

        <a href="/student/dashboard"
           class="sidebar-brand-link">

            <i class="bi bi-patch-question-fill"></i>

            <span>QuizPlatform</span>

        </a>

    </div>


    <!-- MENU -->

    <nav class="sidebar-menu">

        <!-- Dashboard -->

        <a href="/student/dashboard"
           class="sidebar-link"
           th:classappend="${currentPage == 'dashboard'} ? ' active' : ''">

            <i class="bi bi-speedometer2"></i>

            <span>Dashboard</span>

        </a>


        <!-- Available Quizzes -->

        <a href="/student/quizzes"
           class="sidebar-link"
           th:classappend="${currentPage == 'quizzes'} ? ' active' : ''">

            <i class="bi bi-journal-text"></i>

            <span>Available Quizzes</span>

        </a>


        <!-- History -->

        <a href="/student/history"
           class="sidebar-link"
           th:classappend="${currentPage == 'history'} ? ' active' : ''">

            <i class="bi bi-clock-history"></i>

            <span>Quiz History</span>

        </a>


        <!-- Rankings -->

        <a href="/student/rankings"
           class="sidebar-link"
           th:classappend="${currentPage == 'rankings'} ? ' active' : ''">

            <i class="bi bi-trophy"></i>

            <span>Rankings</span>

        </a>


        <!-- Profile -->

        <a href="/student/profile"
           class="sidebar-link"
           th:classappend="${currentPage == 'profile'} ? ' active' : ''">

            <i class="bi bi-person-circle"></i>

            <span>My Profile</span>

        </a>

    </nav>


    <!-- LOGOUT -->

    <div class="sidebar-bottom">

        <form th:action="@{/logout}"
              method="post"
              class="m-0">

            <button type="submit"
                    class="sidebar-link sidebar-logout">

                <i class="bi bi-box-arrow-right"></i>

                <span>Logout</span>

            </button>

        </form>

    </div>

</div>



<!-- =========================================================
     ADMIN SIDEBAR
     ========================================================= -->

<div th:fragment="sidebar-admin"
     class="admin-sidebar">

    <!-- BRAND -->

    <div class="sidebar-brand">

        <a href="/admin/dashboard"
           class="sidebar-brand-link">

            <i class="bi bi-patch-question-fill"></i>

            <span>QuizPlatform</span>

        </a>

    </div>


    <!-- MENU -->

    <nav class="sidebar-menu">

        <!-- Dashboard -->

        <a href="/admin/dashboard"
           class="sidebar-link"
           th:classappend="${currentPage == 'dashboard'} ? ' active' : ''">

            <i class="bi bi-speedometer2"></i>

            <span>Dashboard</span>

        </a>


        <!-- Quizzes -->

        <a href="/admin/quizzes"
           class="sidebar-link"
           th:classappend="${currentPage == 'quizzes'} ? ' active' : ''">

            <i class="bi bi-journal-text"></i>

            <span>Quizzes</span>

        </a>


        <!-- Create Quiz -->

        <a href="/admin/quizzes/new"
           class="sidebar-link"
           th:classappend="${currentPage == 'create-quiz'} ? ' active' : ''">

            <i class="bi bi-plus-circle"></i>

            <span>Create Quiz</span>

        </a>


        <!-- Categories -->

        <a href="/admin/categories"
           class="sidebar-link"
           th:classappend="${currentPage == 'categories'} ? ' active' : ''">

            <i class="bi bi-grid"></i>

            <span>Categories</span>

        </a>


        <!-- Questions -->

        <a href="/admin/questions"
           class="sidebar-link"
           th:classappend="${currentPage == 'questions'} ? ' active' : ''">

            <i class="bi bi-question-circle"></i>

            <span>Questions</span>

        </a>


        <!-- Students -->

        <a href="/admin/students"
           class="sidebar-link"
           th:classappend="${currentPage == 'students'} ? ' active' : ''">

            <i class="bi bi-people-fill"></i>

            <span>Students</span>

        </a>


        <!-- Results -->

        <a href="/admin/results"
           class="sidebar-link"
           th:classappend="${currentPage == 'results'} ? ' active' : ''">

            <i class="bi bi-bar-chart-fill"></i>

            <span>Results</span>

        </a>


        <!-- Settings -->

        <a href="/admin/settings"
           class="sidebar-link"
           th:classappend="${currentPage == 'settings'} ? ' active' : ''">

            <i class="bi bi-gear"></i>

            <span>Settings</span>

        </a>

    </nav>


    <!-- LOGOUT -->

    <div class="sidebar-bottom">

        <form th:action="@{/logout}"
              method="post"
              class="m-0">

            <button type="submit"
                    class="sidebar-link sidebar-logout">

                <i class="bi bi-box-arrow-right"></i>

                <span>Logout</span>

            </button>

        </form>

    </div>

</div>


</body>
</html>
