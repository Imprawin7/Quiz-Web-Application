<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Quizvera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav sec:authorize="hasRole('ADMIN')" th:replace="~{fragments :: navbar-admin}"></nav>
<nav sec:authorize="hasRole('STUDENT')" th:replace="~{fragments :: navbar-student}"></nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h4 class="fw-bold mb-0"><i class="bi bi-trophy-fill text-warning me-2"></i>Leaderboard</h4>
        <a href="/leaderboard/by-quiz" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-journal-text me-1"></i>Browse by Quiz
        </a>
    </div>

    <form th:action="@{/leaderboard}" method="get" class="card p-3 mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-3">
                <label class="form-label small">Scope</label>
                <select name="categoryId" class="form-select">
                    <option value="">Overall</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${selectedCategoryId != null and selectedCategoryId == c.id}"></option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label small">Period</label>
                <select name="period" class="form-select">
                    <option value="all" th:selected="${selectedPeriod == 'all'}">All Time</option>
                    <option value="monthly" th:selected="${selectedPeriod == 'monthly'}">Monthly</option>
                    <option value="weekly" th:selected="${selectedPeriod == 'weekly'}">Weekly</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label small">Rank By</label>
                <select name="rankBy" class="form-select">
                    <option value="highest" th:selected="${selectedRankBy == 'highest'}">Highest Score</option>
                    <option value="average" th:selected="${selectedRankBy == 'average'}">Average Score</option>
                    <option value="completed" th:selected="${selectedRankBy == 'completed'}">Quizzes Completed</option>
                </select>
            </div>
            <div class="col-6 col-md-3 d-grid">
                <button type="submit" class="btn btn-primary"><i class="bi bi-funnel me-1"></i>Apply</button>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th>Rank</th>
                    <th>Student</th>
                    <th>Highest Score</th>
                    <th>Average Score</th>
                    <th>Quizzes Completed</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry, iter : ${leaderboard}"
                    th:classappend="${iter.index == 0} ? 'rank-1' : (${iter.index == 1} ? 'rank-2' : (${iter.index == 2} ? 'rank-3' : ''))">
                    <td class="fw-bold">
                        <span th:if="${iter.index == 0}">🥇</span>
                        <span th:if="${iter.index == 1}">🥈</span>
                        <span th:if="${iter.index == 2}">🥉</span>
                        <span th:if="${iter.index > 2}" th:text="'#' + ${iter.index + 1}"></span>
                    </td>
                    <td th:text="${entry.student.fullName}">Student</td>
                    <td th:text="${entry.highestPercentage} + '%'" th:classappend="${selectedRankBy == 'highest'} ? 'fw-bold text-primary' : ''">0%</td>
                    <td th:text="${entry.averagePercentage} + '%'" th:classappend="${selectedRankBy == 'average'} ? 'fw-bold text-primary' : ''">0%</td>
                    <td th:text="${entry.quizzesCompleted}" th:classappend="${selectedRankBy == 'completed'} ? 'fw-bold text-primary' : ''">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(leaderboard)}">
                    <td colspan="5" class="text-center text-muted py-4">No results for this scope/period yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
