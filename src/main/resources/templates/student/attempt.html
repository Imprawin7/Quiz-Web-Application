<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${quiz.title} + ' - In Progress'">Quiz Attempt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark shadow-sm sticky-top" style="background-color:#4338ca;">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 fw-bold text-truncate" th:text="${quiz.title}">Quiz</span>
        <div class="text-white text-center">
            <div class="small opacity-75">Time Remaining</div>
            <div id="timer-display" class="text-white">--:--</div>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width:800px;">

    <!-- Question palette: jump to any question, shows answered/unanswered state -->
    <div class="card p-3 mb-3">
        <div class="d-flex flex-wrap gap-2" id="questionPalette">
            <button type="button" class="btn btn-sm btn-outline-secondary palette-btn" th:each="q, iter : ${questions}"
                    th:data-index="${iter.index}" th:text="${iter.index + 1}"></button>
        </div>
        <div class="small text-muted mt-2">
            <span class="badge bg-primary">&nbsp;</span> Current &nbsp;
            <span class="badge bg-success">&nbsp;</span> Answered &nbsp;
            <span class="badge bg-outline-secondary border">&nbsp;</span> Unanswered
        </div>
    </div>

    <form id="quizForm" th:action="@{/quiz/attempt/{id}/submit(id=${attempt.id})}" method="post">

        <div class="card question-card mb-3 p-3 p-md-4 question-page" th:each="q, iter : ${questions}"
             th:id="'q-block-' + ${q.id}" th:data-index="${iter.index}">
            <p class="fw-semibold mb-3">
                <span class="badge bg-primary me-2" th:text="${iter.index + 1} + ' / ' + ${#lists.size(questions)}">1 / 10</span>
                <span th:text="${q.questionText}">Question text goes here?</span>
                <span class="badge bg-light text-dark border float-end" th:text="${q.marks} + ' pt'">1 pt</span>
            </p>

            <div th:each="opt : ${ {'A','B','C','D'} }">
                <input type="radio" th:name="'q_' + ${q.id}" th:id="'q_' + ${q.id} + '_' + ${opt}"
                       th:value="${opt}" class="visually-hidden option-radio">
                <label th:for="'q_' + ${q.id} + '_' + ${opt}" class="option-label">
                    <span class="fw-bold me-1" th:text="${opt} + '.'">A.</span>
                    <span th:text="${q.getOptionByKey(opt)}">Option text</span>
                </label>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <button type="button" class="btn btn-outline-secondary btn-nav-prev">
                    <i class="bi bi-arrow-left me-1"></i>Previous
                </button>
                <button type="button" class="btn btn-outline-primary btn-nav-next">
                    Next<i class="bi bi-arrow-right ms-1"></i>
                </button>
            </div>
        </div>

        <div class="d-grid mt-4 mb-5">
            <button type="submit" class="btn btn-primary btn-lg" onclick="return confirm('Submit your answers now?');">
                <i class="bi bi-send-check me-1"></i>Submit Quiz
            </button>
        </div>
    </form>
</div>

<script th:inline="javascript">
    let remaining = /*[[${remainingSeconds}]]*/ 600;
    const display = document.getElementById('timer-display');
    const form = document.getElementById('quizForm');
    let autoSubmitted = false;

    function formatTime(totalSeconds) {
        const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const s = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
        return m + ':' + s;
    }

    function tick() {
        display.textContent = formatTime(remaining);
        if (remaining <= 60) {
            display.classList.add('timer-warning');
        }
        if (remaining <= 0 && !autoSubmitted) {
            autoSubmitted = true;
            display.textContent = "00:00";
            form.submit();
            return;
        }
        remaining--;
    }

    tick();
    setInterval(tick, 1000);

    // ---- Question navigation (all questions live in the DOM/form; we just show one at a time) ----
    const pages = Array.from(document.querySelectorAll('.question-page'));
    const paletteButtons = Array.from(document.querySelectorAll('.palette-btn'));
    let currentIndex = 0;

    function isAnswered(index) {
        const page = pages[index];
        return page.querySelector('input[type="radio"]:checked') !== null;
    }

    function refreshPalette() {
        paletteButtons.forEach(function (btn, i) {
            btn.classList.remove('btn-primary', 'btn-success', 'btn-outline-secondary');
            if (i === currentIndex) {
                btn.classList.add('btn-primary');
            } else if (isAnswered(i)) {
                btn.classList.add('btn-success');
            } else {
                btn.classList.add('btn-outline-secondary');
            }
        });
    }

    function showQuestion(index) {
        if (index < 0 || index >= pages.length) return;
        pages.forEach(function (page, i) {
            page.style.display = (i === index) ? '' : 'none';
        });
        currentIndex = index;
        refreshPalette();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    paletteButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
            showQuestion(parseInt(btn.dataset.index, 10));
        });
    });

    pages.forEach(function (page) {
        const prevBtn = page.querySelector('.btn-nav-prev');
        const nextBtn = page.querySelector('.btn-nav-next');
        prevBtn.addEventListener('click', function () { showQuestion(currentIndex - 1); });
        nextBtn.addEventListener('click', function () { showQuestion(currentIndex + 1); });
    });

    // Highlight selected option + refresh the palette's answered state
    document.querySelectorAll('.option-radio').forEach(function (radio) {
        radio.addEventListener('change', function () {
            const name = radio.name;
            document.querySelectorAll('input[name="' + name + '"]').forEach(function (r) {
                document.querySelector('label[for="' + r.id + '"]').classList.remove('selected');
            });
            document.querySelector('label[for="' + radio.id + '"]').classList.add('selected');
            refreshPalette();
        });
    });

    showQuestion(0);

    // Warn before leaving the tab / closing accidentally
    window.addEventListener('beforeunload', function (e) {
        if (!autoSubmitted) {
            e.preventDefault();
            e.returnValue = '';
        }
    });
    form.addEventListener('submit', function () { autoSubmitted = true; });
</script>
</body>
</html>
