<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Quizzes - Quizvera</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Project CSS -->
    <link href="/css/style.css"
          rel="stylesheet">
</head>

<body>

<!-- =========================================================
     STUDENT NAVBAR
     ========================================================= -->

<nav th:replace="~{fragments :: navbar-student}"></nav>


<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="container pb-5">

    <!-- PAGE HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                Available Quizzes
            </h3>

            <p class="text-muted mb-0">
                Choose a quiz and test your knowledge.
            </p>
        </div>

        <a href="/student/dashboard"
           class="btn btn-outline-primary">

            <i class="bi bi-arrow-left me-1"></i>
            Dashboard

        </a>

    </div>


    <!-- =====================================================
         AVAILABLE QUIZZES
         ===================================================== -->

    <div class="row g-4">

        <!-- QUIZ CARD -->

        <div class="col-12 col-md-6 col-lg-4"
             th:each="quiz : ${availableQuizzes}">

            <div class="card h-100 p-3">

                <!-- THUMBNAIL -->

                <div th:if="${quiz.thumbnailUrl != null}"
                     class="mb-3">

                    <img th:src="${quiz.thumbnailUrl}"
                         class="img-fluid rounded-3"
                         style="height: 160px; width: 100%; object-fit: cover;"
                         alt="Quiz thumbnail">

                </div>


                <!-- TITLE -->

                <h5 class="fw-bold mb-2"
                    th:text="${quiz.title}">
                    Quiz Title
                </h5>


                <!-- CATEGORY -->

                <p class="text-muted small mb-2">

                    <i class="bi bi-folder me-1"></i>

                    <span th:text="${quiz.category != null ? quiz.category.name : 'Uncategorized'}">
                        Category
                    </span>

                </p>


                <!-- DESCRIPTION -->

                <p class="text-muted mb-3"
                   th:text="${quiz.description}">
                    Quiz description
                </p>


                <!-- QUIZ INFORMATION -->

                <div class="d-flex flex-wrap gap-3 small text-muted mb-3">

                    <span>

                        <i class="bi bi-question-circle me-1"></i>

                        <span th:text="${quiz.questionCount}">
                            0
                        </span>

                        Questions

                    </span>


                    <span>

                        <i class="bi bi-clock me-1"></i>

                        <span th:text="${quiz.durationMinutes}">
                            0
                        </span>

                        Minutes

                    </span>


                    <span>

                        <i class="bi bi-check-circle me-1"></i>

                        <span th:text="${quiz.passingPercentage}">
                            40
                        </span>

                        % to pass

                    </span>

                </div>


                <!-- START QUIZ -->

                <div class="mt-auto">

                    <a th:href="@{/quiz/{id}/start(id=${quiz.id})}"
                       class="btn btn-primary w-100">

                        <i class="bi bi-play-fill me-1"></i>
                        Start Quiz

                    </a>

                </div>

            </div>

        </div>


        <!-- =================================================
             NO QUIZZES
             ================================================= -->

        <div class="col-12"
             th:if="${#lists.isEmpty(availableQuizzes)}">

            <div class="card p-5 text-center">

                <div class="mb-3">

                    <i class="bi bi-journal-x display-5 text-muted"></i>

                </div>

                <h5 class="fw-bold">
                    No Quizzes Available
                </h5>

                <p class="text-muted mb-3">
                    There are no quizzes available for you right now.
                    Please check back later.
                </p>

                <a href="/student/dashboard"
                   class="btn btn-outline-primary">

                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Dashboard

                </a>

            </div>

        </div>

    </div>

</main>


<!-- =========================================================
     BOOTSTRAP JAVASCRIPT
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
