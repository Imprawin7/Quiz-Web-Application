<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Quizzes - QuizPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar-student}"></nav>

<div class="container pb-5">
    <h4 class="fw-bold mb-3">Available Quizzes</h4>

    <form th:action="@{/student/quizzes}" method="get" class="card p-3 mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
                <label class="form-label small">Search</label>
                <input type="text" name="search" class="form-control" placeholder="Search by title or description..." th:value="${search}">
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small">Category</label>
                <select name="categoryId" class="form-select">
                    <option value="">All categories</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${selectedCategoryId != null and selectedCategoryId == c.id}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small">Difficulty</label>
                <select name="difficulty" class="form-select">
                    <option value="">Any</option>
                    <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}"
                            th:selected="${selectedDifficulty != null and selectedDifficulty == d}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small">Max Duration</label>
                <select name="maxDuration" class="form-select">
                    <option value="">Any length</option>
                    <option value="10" th:selected="${selectedMaxDuration != null and selectedMaxDuration == 10}">Up to 10 min</option>
                    <option value="20" th:selected="${selectedMaxDuration != null and selectedMaxDuration == 20}">Up to 20 min</option>
                    <option value="30" th:selected="${selectedMaxDuration != null and selectedMaxDuration == 30}">Up to 30 min</option>
                    <option value="60" th:selected="${selectedMaxDuration != null and selectedMaxDuration == 60}">Up to 60 min</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small">Sort By</label>
                <select name="sortBy" class="form-select">
                    <option value="newest" th:selected="${selectedSortBy == 'newest'}">Recently Added</option>
                    <option value="popularity" th:selected="${selectedSortBy == 'popularity'}">Most Popular</option>
                </select>
            </div>
            <div class="col-12 d-grid">
                <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1"></i>Search</button>
            </div>
        </div>
    </form>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="quiz : ${quizzes}">
            <div class="card h-100 p-3">
                <img th:if="${quiz.thumbnailUrl != null}" th:src="${quiz.thumbnailUrl}"
                     class="rounded-3 mb-2" style="height:130px; object-fit:cover; width:100%;" alt="Quiz thumbnail">
                <div class="d-flex justify-content-between align-items-start mb-1">
                    <h5 class="fw-bold mb-0" th:text="${quiz.title}">Title</h5>
                    <span class="badge bg-light text-dark border" th:text="${quiz.difficulty}">MEDIUM</span>
                </div>
                <p class="text-muted small mb-2" th:text="${quiz.category != null ? quiz.category.name : 'Uncategorized'}">Category</p>
                <p class="mb-3" th:text="${quiz.description}">Description</p>
                <div class="d-flex gap-3 small text-muted mb-2 flex-wrap">
                    <span><i class="bi bi-question-circle me-1"></i><span th:text="${quiz.questionCount}">0</span> Qs</span>
                    <span><i class="bi bi-clock me-1"></i><span th:text="${quiz.durationMinutes}">0</span> min</span>
                    <span><i class="bi bi-star me-1"></i><span th:text="${quiz.totalMarks}">0</span> marks</span>
                </div>
                <div class="d-flex gap-3 small text-muted mb-3 flex-wrap">
                    <span><i class="bi bi-check2-circle me-1"></i>Pass: <span th:text="${quiz.passingPercentage}">40</span>%</span>
                    <span><i class="bi bi-arrow-repeat me-1"></i>Attempts: <span th:text="${quiz.maxAttempts}">1</span></span>
                </div>
                <a th:href="@{/quiz/{id}/start(id=${quiz.id})}" class="btn btn-primary mt-auto">Start Quiz</a>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(quizzes)}">
            <div class="card p-5 text-center text-muted">No quizzes match your search/filters.</div>
        </div>
    </div>
</div>
</body>
</html>
