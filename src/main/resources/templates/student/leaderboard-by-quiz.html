<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboards by Quiz - Quizvera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav sec:authorize="hasRole('ADMIN')" th:replace="~{fragments :: navbar-admin}"></nav>
<nav sec:authorize="hasRole('STUDENT')" th:replace="~{fragments :: navbar-student}"></nav>

<div class="container pb-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/leaderboard">Leaderboard</a></li>
            <li class="breadcrumb-item active">By Quiz</li>
        </ol>
    </nav>

    <h4 class="fw-bold mb-4"><i class="bi bi-trophy-fill text-warning me-2"></i>Leaderboards by Quiz</h4>
    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="quiz : ${quizzes}">
            <div class="card p-3 h-100">
                <h5 class="fw-bold mb-1" th:text="${quiz.title}">Quiz</h5>
                <p class="text-muted small mb-3" th:text="${quiz.category != null ? quiz.category.name : 'Uncategorized'}">Category</p>
                <a th:href="@{/leaderboard/{id}(id=${quiz.id})}" class="btn btn-outline-primary mt-auto">View Leaderboard</a>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(quizzes)}">
            <div class="card p-5 text-center text-muted">No quizzes available yet.</div>
        </div>
    </div>
</div>
</body>
</html>
