<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - QuizPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<div class="container pb-5">
    <h4 class="fw-bold mb-4"><i class="bi bi-tags me-2"></i>Manage Categories</h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">
        <div class="col-md-5 mb-4">
            <div class="card p-3">
                <h6 class="fw-bold mb-3">Add New Category</h6>
                <form th:action="@{/admin/categories}" method="post">
                    <div class="mb-2">
                        <label class="form-label small">Name</label>
                        <input type="text" name="name" class="form-control" required placeholder="e.g. Java, Mathematics">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Description (optional)</label>
                        <input type="text" name="description" class="form-control" placeholder="Short description">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Add Category</button>
                </form>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card">
                <div class="table-responsive">
                    <table class="table mb-0 align-middle">
                        <thead><tr><th>Name</th><th>Description</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="c : ${categories}">
                            <td class="fw-semibold" th:text="${c.name}">Name</td>
                            <td class="text-muted small" th:text="${c.description}">Description</td>
                            <td class="text-end">
                                <button type="button" class="btn btn-sm btn-outline-secondary"
                                        data-bs-toggle="collapse" th:data-bs-target="'#edit-' + ${c.id}">Edit</button>
                                <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this category? Quizzes using it will become uncategorized.');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:each="c : ${categories}">
                            <td colspan="3" class="p-0 border-0">
                                <div class="collapse" th:id="'edit-' + ${c.id}">
                                    <form th:action="@{/admin/categories/{id}(id=${c.id})}" method="post" class="d-flex gap-2 p-2 bg-light">
                                        <input type="text" name="name" class="form-control form-control-sm" th:value="${c.name}" required>
                                        <input type="text" name="description" class="form-control form-control-sm" th:value="${c.description}" placeholder="Description">
                                        <button type="submit" class="btn btn-sm btn-primary text-nowrap">Save</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="3" class="text-center text-muted py-4">No categories yet. Add one on the left.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
