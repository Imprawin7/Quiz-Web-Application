<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Quiz Attempts - Quizvera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<div class="container pb-5">
    <h4 class="fw-bold mb-4"><i class="bi bi-clipboard-data me-2"></i>All Quiz Attempts</h4>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead><tr><th>Student</th><th>Quiz</th><th>Score</th><th>%</th><th>Status</th><th>Started</th><th>Submitted</th></tr></thead>
                <tbody>
                <tr th:each="a : ${attempts}">
                    <td th:text="${a.student.fullName}">Student</td>
                    <td th:text="${a.quiz.title}">Quiz</td>
                    <td th:text="${a.score} + '/' + ${a.totalMarks}">0</td>
                    <td th:text="${a.percentage} + '%'">0%</td>
                    <td>
                        <span th:if="${a.status.name() == 'IN_PROGRESS'}" class="badge bg-primary">In Progress</span>
                        <span th:if="${a.status.name() == 'SUBMITTED'}" class="badge bg-success">Submitted</span>
                        <span th:if="${a.status.name() == 'TIME_EXPIRED'}" class="badge bg-warning text-dark">Time Expired</span>
                    </td>
                    <td th:text="${#temporals.format(a.startTime, 'dd MMM yyyy, HH:mm')}">-</td>
                    <td th:text="${a.endTime != null} ? ${#temporals.format(a.endTime, 'dd MMM yyyy, HH:mm')} : '-'">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(attempts)}">
                    <td colspan="7" class="text-center text-muted py-4">No quiz attempts recorded yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
