<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${category.name} + ' Quizzes - Quizvera'">Category Quizzes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<div class="container pb-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin/categories">Categories</a></li>
            <li class="breadcrumb-item active" th:text="${category.name}">Category</li>
        </ol>
    </nav>

    <h4 class="fw-bold mb-1" th:text="${category.name}">Category</h4>
    <p class="text-muted mb-4" th:text="${category.description}">Description</p>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead><tr><th>Title</th><th>Difficulty</th><th>Questions</th><th>Duration</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="quiz : ${quizzes}">
                    <td class="fw-semibold" th:text="${quiz.title}">Title</td>
                    <td th:text="${quiz.difficulty}">MEDIUM</td>
                    <td th:text="${quiz.questionCount}">0</td>
                    <td th:text="${quiz.durationMinutes} + ' min'">10 min</td>
                    <td>
                        <span th:if="${quiz.status.name() == 'PUBLISHED'}" class="badge bg-success">Published</span>
                        <span th:if="${quiz.status.name() == 'DRAFT'}" class="badge bg-secondary">Draft</span>
                        <span th:if="${quiz.status.name() == 'UNPUBLISHED'}" class="badge bg-warning text-dark">Unpublished</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/admin/quizzes/{id}/questions(id=${quiz.id})}" class="btn btn-sm btn-outline-primary">Manage</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(quizzes)}">
                    <td colspan="6" class="text-center text-muted py-4">No quizzes in this category yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
