<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions - Quizvera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<div class="container pb-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin/quizzes">Quizzes</a></li>
            <li class="breadcrumb-item active" th:text="${quiz.title}">Quiz</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0" th:text="${quiz.title}">Quiz Title</h4>
            <p class="text-muted mb-0">
                <span th:text="${#lists.size(questions)}">0</span> questions ·
                <span th:text="${quiz.totalMarks}">0</span> total marks ·
                <span th:text="${quiz.durationMinutes}">0</span> min
            </p>
        </div>
        <a th:href="@{/admin/quizzes/{id}/questions/new(id=${quiz.id})}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Add Question
        </a>
    </div>

    <div class="card mb-2 p-3" th:each="q, iter : ${questions}">
        <div class="d-flex justify-content-between">
            <p class="fw-semibold mb-2"><span th:text="${iter.index + 1}">1</span>. <span th:text="${q.questionText}">Question text</span></p>
            <div class="text-nowrap">
                <span class="badge bg-light text-dark border" th:text="${q.difficulty}">MEDIUM</span>
                <span class="badge bg-light text-dark border" th:text="${q.marks} + ' pt(s)'">1 pt</span>
            </div>
        </div>
        <div class="row small">
            <div class="col-6 col-md-3 mb-1" th:classappend="${q.correctOption == 'A'} ? 'text-success fw-bold' : ''">A. <span th:text="${q.optionA}"></span></div>
            <div class="col-6 col-md-3 mb-1" th:classappend="${q.correctOption == 'B'} ? 'text-success fw-bold' : ''">B. <span th:text="${q.optionB}"></span></div>
            <div class="col-6 col-md-3 mb-1" th:classappend="${q.correctOption == 'C'} ? 'text-success fw-bold' : ''">C. <span th:text="${q.optionC}"></span></div>
            <div class="col-6 col-md-3 mb-1" th:classappend="${q.correctOption == 'D'} ? 'text-success fw-bold' : ''">D. <span th:text="${q.optionD}"></span></div>
        </div>
        <p class="small text-muted fst-italic mt-2 mb-0" th:if="${q.explanation != null}">
            <i class="bi bi-lightbulb me-1"></i><span th:text="${q.explanation}"></span>
        </p>
        <div class="mt-2 d-flex gap-2">
            <a th:href="@{/admin/quizzes/{qid}/questions/{id}/edit(qid=${quiz.id},id=${q.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
            <form th:action="@{/admin/quizzes/{qid}/questions/{id}/delete(qid=${quiz.id},id=${q.id})}" method="post"
                  onsubmit="return confirm('Delete this question?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
        </div>
    </div>

    <div class="card p-5 text-center text-muted" th:if="${#lists.isEmpty(questions)}">
        No questions added yet. Click "Add Question" to get started.
    </div>
</div>
</body>
</html>
