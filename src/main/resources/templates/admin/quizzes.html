<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Quizzes - QuizPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Manage Quizzes</h4>
        <a href="/admin/quizzes/new" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New Quiz</a>
    </div>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="quiz : ${quizzes}">
            <div class="card h-100 p-3">
                <img th:if="${quiz.thumbnailUrl != null}" th:src="${quiz.thumbnailUrl}"
                     class="rounded-3 mb-2" style="height:120px; object-fit:cover; width:100%;" alt="Quiz thumbnail">

                <div class="d-flex justify-content-between align-items-start">
                    <h5 class="fw-bold mb-1" th:text="${quiz.title}">Title</h5>
                    <span th:if="${quiz.status.name() == 'PUBLISHED'}" class="badge bg-success">Published</span>
                    <span th:if="${quiz.status.name() == 'DRAFT'}" class="badge bg-secondary">Draft</span>
                    <span th:if="${quiz.status.name() == 'UNPUBLISHED'}" class="badge bg-warning text-dark">Unpublished</span>
                </div>
                <p class="text-muted small mb-2" th:text="${quiz.category != null ? quiz.category.name : 'Uncategorized'} + ' · ' + ${quiz.difficulty}">Category</p>
                <p class="mb-2" th:text="${quiz.description}">Description</p>
                <div class="d-flex gap-3 small text-muted mb-2 flex-wrap">
                    <span><i class="bi bi-question-circle me-1"></i><span th:text="${quiz.questionCount}">0</span> Qs</span>
                    <span><i class="bi bi-clock me-1"></i><span th:text="${quiz.durationMinutes}">0</span> min</span>
                    <span><i class="bi bi-star me-1"></i><span th:text="${quiz.totalMarks}">0</span> marks</span>
                </div>
                <div class="d-flex gap-3 small text-muted mb-3 flex-wrap">
                    <span><i class="bi bi-check2-circle me-1"></i>Pass: <span th:text="${quiz.passingPercentage}">40</span>%</span>
                    <span><i class="bi bi-arrow-repeat me-1"></i>Max attempts: <span th:text="${quiz.maxAttempts}">1</span></span>
                </div>
                <div class="mt-auto d-flex flex-wrap gap-2">
                    <a th:href="@{/admin/quizzes/{id}/questions(id=${quiz.id})}" class="btn btn-sm btn-primary">Questions</a>
                    <a th:href="@{/admin/quizzes/{id}/edit(id=${quiz.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                    <a th:href="@{/admin/quizzes/{id}/attempts(id=${quiz.id})}" class="btn btn-sm btn-outline-info">Results</a>
                    <form th:action="@{/admin/quizzes/{id}/toggle(id=${quiz.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-warning"
                                th:text="${quiz.status.name() == 'PUBLISHED'} ? 'Unpublish' : 'Publish'">Toggle</button>
                    </form>
                    <form th:action="@{/admin/quizzes/{id}/delete(id=${quiz.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this quiz and all its questions/attempts?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(quizzes)}">
            <div class="card p-5 text-center text-muted">No quizzes created yet.</div>
        </div>
    </div>
</div>
</body>
</html>
