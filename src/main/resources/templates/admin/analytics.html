<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Quizvera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<div class="container pb-5">
    <h4 class="fw-bold mb-4"><i class="bi bi-graph-up me-2"></i>Performance Analytics</h4>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th>Quiz</th>
                    <th>Attempts</th>
                    <th>Avg Score</th>
                    <th>Avg %</th>
                    <th>Highest %</th>
                    <th>Lowest %</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${statsList}">
                    <td class="fw-semibold" th:text="${s.quiz.title}">Quiz</td>
                    <td th:text="${s.totalAttempts}">0</td>
                    <td th:text="${s.averageScore}">0</td>
                    <td>
                        <div class="d-flex align-items-center gap-2" style="min-width:120px;">
                            <div class="progress flex-grow-1" style="height:8px;">
                                <div class="progress-bar bg-primary" th:style="'width:' + ${s.averagePercentage} + '%'"></div>
                            </div>
                            <span th:text="${s.averagePercentage} + '%'"></span>
                        </div>
                    </td>
                    <td><span class="badge bg-success" th:text="${s.highestPercentage} + '%'">0%</span></td>
                    <td><span class="badge bg-danger" th:text="${s.lowestPercentage} + '%'">0%</span></td>
                    <td><a th:href="@{/admin/quizzes/{id}/attempts(id=${s.quiz.id})}" class="btn btn-sm btn-outline-primary">Details</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(statsList)}">
                    <td colspan="7" class="text-center text-muted py-4">No data yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
