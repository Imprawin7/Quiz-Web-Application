<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - QuizPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h4 class="fw-bold mb-0"><i class="bi bi-people me-2"></i>Manage Students</h4>
        <form th:action="@{/admin/users}" method="get" class="d-flex" style="max-width:320px;">
            <input type="text" name="search" class="form-control form-control-sm me-2"
                   placeholder="Search by name, username, or email" th:value="${search}">
            <button type="submit" class="btn btn-sm btn-primary text-nowrap">
                <i class="bi bi-search"></i>
            </button>
        </form>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Registered</th>
                    <th>Status</th>
                    <th>Quizzes Attempted</th>
                    <th>Average Score</th>
                    <th>Highest Score</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${students}">
                    <td class="fw-semibold" th:text="${s.fullName}">Name</td>
                    <td th:text="${s.email}">email</td>
                    <td th:text="${#temporals.format(s.createdAt, 'dd MMM yyyy')}">-</td>
                    <td>
                        <span th:if="${s.enabled}" class="badge bg-success">Active</span>
                        <span th:unless="${s.enabled}" class="badge bg-secondary">Deactivated</span>
                    </td>
                    <td th:text="${statsMap[s.id].totalAttempts}">0</td>
                    <td th:text="${statsMap[s.id].averagePercentage} + '%'">0%</td>
                    <td th:text="${statsMap[s.id].bestPercentage} + '%'">0%</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/admin/users/{id}(id=${s.id})}" class="btn btn-sm btn-outline-primary">View</a>
                        <form th:action="@{/admin/users/{id}/toggle(id=${s.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Are you sure you want to change this student\'s status?');">
                            <button type="submit" class="btn btn-sm" th:classappend="${s.enabled} ? 'btn-outline-warning' : 'btn-outline-success'"
                                    th:text="${s.enabled} ? 'Deactivate' : 'Activate'">Toggle</button>
                        </form>
                        <form th:action="@{/admin/users/{id}/delete(id=${s.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this student account? Their quiz history is kept for records, but they will no longer be able to log in or appear in this list.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="8" class="text-center text-muted py-4">
                        <span th:if="${search}">No students match "<span th:text="${search}"></span>".</span>
                        <span th:unless="${search}">No students have registered yet.</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
