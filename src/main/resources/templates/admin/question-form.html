<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Question' : 'New Question'">Question Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7">
            <div class="card p-4">
                <h4 class="fw-bold mb-1" th:text="${isEdit} ? 'Edit Question' : 'Add Question'">Question Form</h4>
                <p class="text-muted mb-4">Quiz: <strong th:text="${quiz.title}">Quiz</strong></p>

                <form th:action="${isEdit} ? @{/admin/quizzes/{qid}/questions/{id}(qid=${quiz.id},id=${question.id})} : @{/admin/quizzes/{qid}/questions(qid=${quiz.id})}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Question Text</label>
                        <textarea name="questionText" class="form-control" rows="2" required th:text="${question.questionText}"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Option A</label>
                            <input type="text" name="optionA" class="form-control" th:value="${question.optionA}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Option B</label>
                            <input type="text" name="optionB" class="form-control" th:value="${question.optionB}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Option C</label>
                            <input type="text" name="optionC" class="form-control" th:value="${question.optionC}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Option D</label>
                            <input type="text" name="optionD" class="form-control" th:value="${question.optionD}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Correct Option</label>
                            <select name="correctOption" class="form-select" required>
                                <option value="">-- select --</option>
                                <option value="A" th:selected="${question.correctOption == 'A'}">A</option>
                                <option value="B" th:selected="${question.correctOption == 'B'}">B</option>
                                <option value="C" th:selected="${question.correctOption == 'C'}">C</option>
                                <option value="D" th:selected="${question.correctOption == 'D'}">D</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Marks</label>
                            <input type="number" name="marks" class="form-control" min="1" th:value="${question.marks} ?: 1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Difficulty</label>
                            <select name="difficulty" class="form-select" required>
                                <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}"
                                        th:selected="${question.difficulty != null and question.difficulty == d}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Explanation <span class="text-muted small">(optional — shown to students after they submit)</span></label>
                        <textarea name="explanation" class="form-control" rows="2"
                                  placeholder="e.g. JSON.parse() converts a JSON string into a JavaScript object."
                                  th:text="${question.explanation}"></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Question</button>
                        <a th:href="@{/admin/quizzes/{id}/questions(id=${quiz.id})}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
