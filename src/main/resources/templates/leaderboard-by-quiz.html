<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Leaderboards by Quiz - QuizPlatform</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- QuizPlatform CSS -->
    <link href="/css/style.css"
          rel="stylesheet">

</head>


<body>

<div class="quiz-layout">


    <!-- =====================================================
         STUDENT SIDEBAR
         ===================================================== -->

    <aside sec:authorize="hasRole('STUDENT')"
           th:replace="~{fragments :: sidebar-student}">
    </aside>


    <!-- =====================================================
         ADMIN SIDEBAR
         ===================================================== -->

    <aside sec:authorize="hasRole('ADMIN')"
           th:replace="~{fragments :: sidebar-admin}">
    </aside>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="quiz-main">


        <!-- =================================================
             BREADCRUMB
             ================================================= -->

        <nav aria-label="breadcrumb"
             class="mb-3">

            <ol class="breadcrumb">

                <li class="breadcrumb-item">

                    <a href="/leaderboard">
                        Leaderboard
                    </a>

                </li>

                <li class="breadcrumb-item active">
                    By Quiz
                </li>

            </ol>

        </nav>


        <!-- =================================================
             PAGE HEADER
             ================================================= -->

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

            <div>

                <h3 class="fw-bold mb-1">

                    <i class="bi bi-trophy-fill text-warning me-2"></i>

                    Leaderboards by Quiz

                </h3>

                <p class="text-muted mb-0">
                    Choose a quiz to view its student rankings.
                </p>

            </div>


            <a href="/leaderboard"
               class="btn btn-outline-primary">

                <i class="bi bi-trophy me-1"></i>

                Overall Leaderboard

            </a>

        </div>


        <!-- =================================================
             QUIZ CARDS
             ================================================= -->

        <div class="row g-4">


            <div class="col-12 col-md-6 col-lg-4"
                 th:each="quiz : ${quizzes}">


                <div class="card quiz-card h-100">


                    <!-- Card Body -->

                    <div class="card-body d-flex flex-column">


                        <!-- Quiz Icon -->

                        <div class="quiz-card-icon mb-3">

                            <i class="bi bi-journal-text"></i>

                        </div>


                        <!-- Quiz Title -->

                        <h5 class="fw-bold mb-1"
                            th:text="${quiz.title}">

                            Quiz

                        </h5>


                        <!-- Category -->

                        <p class="text-muted small mb-2">

                            <i class="bi bi-folder me-1"></i>

                            <span th:text="${quiz.category != null
                                ? quiz.category.name
                                : 'Uncategorized'}">

                                Category

                            </span>

                        </p>


                        <!-- Quiz Details -->

                        <div class="d-flex gap-3 flex-wrap small text-muted mb-4">

                            <span>

                                <i class="bi bi-question-circle me-1"></i>

                                <span th:text="${quiz.questionCount}">
                                    0
                                </span>

                                Questions

                            </span>


                            <span>

                                <i class="bi bi-clock me-1"></i>

                                <span th:text="${quiz.durationMinutes}">
                                    0
                                </span>

                                min

                            </span>

                        </div>


                        <!-- View Leaderboard -->

                        <a th:href="@{/leaderboard/{id}(id=${quiz.id})}"
                           class="btn btn-outline-primary mt-auto">

                            <i class="bi bi-trophy me-1"></i>

                            View Leaderboard

                        </a>


                    </div>

                </div>

            </div>


            <!-- =================================================
                 NO QUIZZES
                 ================================================= -->

            <div class="col-12"
                 th:if="${#lists.isEmpty(quizzes)}">

                <div class="card p-5 text-center text-muted">

                    <div class="mb-3">

                        <i class="bi bi-trophy fs-1"></i>

                    </div>


                    <h5 class="fw-bold">
                        No quizzes available
                    </h5>


                    <p class="mb-3">
                        There are no quizzes available for leaderboard rankings yet.
                    </p>


                    <a href="/student/quizzes"
                       sec:authorize="hasRole('STUDENT')"
                       class="btn btn-primary">

                        <i class="bi bi-search me-1"></i>

                        Browse Quizzes

                    </a>

                </div>

            </div>


        </div>


        <!-- =================================================
             BACK BUTTON
             ================================================= -->

        <div class="mt-4">

            <a href="/leaderboard"
               class="btn btn-outline-primary">

                <i class="bi bi-arrow-left me-1"></i>

                Back to Leaderboard

            </a>

        </div>


    </main>

</div>

</body>

</html>
