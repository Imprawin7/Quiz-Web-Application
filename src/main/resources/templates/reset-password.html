<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Quizvera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill" style="font-size:2.5rem;color:#4f46e5;"></i>
            <h3 class="mt-2 mb-0 fw-bold">Reset Password</h3>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

        <form th:action="@{/reset-password}" method="post" th:if="${token != null and success == null}">
            <input type="hidden" name="token" th:value="${token}">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <input type="password" name="newPassword" id="newPassword" class="form-control" required minlength="4" autofocus>
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="newPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <div class="input-group">
                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" required minlength="4">
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="confirmPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Reset Password</button>
        </form>

        <p class="text-center mt-4 mb-0 text-muted">
            <a href="/login">Back to login</a>
        </p>
        <p class="text-center mt-2 mb-0 text-muted" th:if="${error}">
            <a href="/forgot-password">Request a new reset link</a>
        </p>
    </div>
</div>

<script>
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const input = document.getElementById(btn.dataset.target);
            const icon = btn.querySelector('i');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('bi-eye', !isHidden);
            icon.classList.toggle('bi-eye-slash', isHidden);
        });
    });
</script>
</body>
</html>
