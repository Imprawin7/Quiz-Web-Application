<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - QuizPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-key-fill" style="font-size:2.5rem;color:#4f46e5;"></i>
            <h3 class="mt-2 mb-0 fw-bold">Forgot Password</h3>
            <p class="text-muted">Enter your account email and we'll send you a reset link.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

        <form th:action="@{/forgot-password}" method="post" th:unless="${success}">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Send Reset Link</button>
        </form>

        <p class="text-center mt-4 mb-0 text-muted">
            <a href="/login">Back to login</a>
        </p>
    </div>
</div>
</body>
</html>
