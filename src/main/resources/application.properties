# ============================================
# Online Quiz Platform - Configuration
# ============================================

spring.application.name=online-quiz-platform
server.port=${PORT:8080}


# ============================================
# Database - PostgreSQL
# ============================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ============================================
# JPA / Hibernate
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ============================================
# Thymeleaf
# ============================================

spring.thymeleaf.cache=true


# ============================================
# Default Admin Account
# ============================================

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL:admin@quizplatform.com}


# ============================================
# Quiz
# ============================================

app.quiz.passing-percentage=40


# ============================================
# Email / SMTP
# ============================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ============================================
# Application Base URL
# ============================================

app.base-url=${APP_BASE_URL:https://quiz-web-application-kl7g.onrender.com}


# ============================================
# Password Reset
# ============================================

app.reset-token.expiry-minutes=30


# ============================================
# File Upload / Misc
# ============================================

spring.mvc.hiddenmethod.filter.enabled=true