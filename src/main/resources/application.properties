# ============================================
# Online Quiz Platform - Configuration
# ============================================

spring.application.name=online-quiz-platform
server.port=8080

# ---- Database: H2 (default, in-memory, zero setup) ----
# To switch to MySQL, comment the H2 block and uncomment the MySQL block below.
#spring.datasource.url=jdbc:h2:file:./data/quizdb;AUTO_SERVER=TRUE
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ---- MySQL (production alternative) ----
# ============================================
# Database: MySQL 8
# ============================================

spring.datasource.url=jdbc:mysql://localhost:3306/quiz_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ============================================
# JPA / Hibernate
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Default admin account (created on first startup if not present) ----
app.admin.username=admin
app.admin.password=Admin@123
app.admin.email=admin@quizplatform.com

# ---- Passing threshold used for "Passed" / "Failed" attempt stats on the admin dashboard ----
# A student's attempt counts as "passed" when their percentage score is >= this value.
app.quiz.passing-percentage=40

# ---- Email (SMTP) — required for the forgot-password / reset-password flow ----
# Example below is configured for Gmail. You must generate a Gmail "App Password"
# (not your normal Gmail password) at https://myaccount.google.com/apppasswords
# — this requires 2-Step Verification to be enabled on the Google account first.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pravinyaadav7@gmail.com
spring.mail.password=ijyl eroq fljv waqn
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL used to build the password-reset link sent in the email.
# Change this to your real domain when deploying.
app.base-url=http://localhost:8080

# How long a password reset link stays valid, in minutes.
app.reset-token.expiry-minutes=30

# ---- File upload / misc ----
spring.mvc.hiddenmethod.filter.enabled=true